name: Publish Firebase Auth Emulator

on:
  push:
    branches:
      - main
    paths:
      - firebase-auth/Dockerfile
      - firebase-auth/firebase.json
      - firebase-auth/package-lock.json
      - firebase-auth/package.json
      - .github/workflows/publish-firebase-auth.yml
      - .github/workflows/reusable-publish-emulator.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-publish-emulator.yml
    with:
      image-name: firebase-auth-emulator
      build-context: firebase-auth
      version-command: |-
        echo "version=$(jq -r '.packages["node_modules/firebase-tools"].version' firebase-auth/package-lock.json)" >> $GITHUB_OUTPUT
      smoke-test-port: "9099"
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
