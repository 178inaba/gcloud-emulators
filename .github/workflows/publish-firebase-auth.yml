name: Publish Firebase Auth Emulator

on:
  push:
    branches:
      - main
    paths:
      - firebase-auth/Dockerfile
      - firebase-auth/firebase.json
      - firebase-auth/package-lock.json
      - firebase-auth/package.json
      - .github/workflows/publish-firebase-auth.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/firebase-auth-emulator
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get firebase-tools version
        id: firebase-tools-version
        run: echo "firebase-tools-version=$(jq -r '.packages["node_modules/firebase-tools"].version' firebase-auth/package-lock.json)" >> $GITHUB_OUTPUT
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.firebase-tools-version.outputs.firebase-tools-version }}
            type=sha,prefix=
          labels: |
            org.opencontainers.image.authors=${{ github.repository_owner }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: firebase-auth
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Generate build image attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}

  test-published-image:
    name: Test Published Image
    runs-on: ubuntu-latest
    needs:
      - build-publish
    services:
      firebase-auth-emulator:
        image: ghcr.io/${{ github.repository_owner }}/firebase-auth-emulator@${{ needs.build-publish.outputs.digest }}
        ports:
          - "9099:9099"
    env:
      FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
    steps:
      - name: Test
        run: curl -f localhost:9099
